aid: woowa-brothers
name: Woowa Brothers
description: >-
  Woowa Brothers is the Seoul-based technology company behind Baedal Minjok
  (Baemin), South Korea's leading food delivery platform, alongside B-Mart
  quick commerce, Baemin Connect rider services, and robotics initiatives for
  serving and delivery robots. A subsidiary of Delivery Hero since 2021, the
  company runs a strong engineering culture through its Woowahan tech blog and
  first-party open-source libraries on GitHub (NestJS libraries, WoowahanJS,
  Redis tooling), but it does not publish a public developer API or developer
  portal.
